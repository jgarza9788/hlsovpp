# hlsovpp: fork of https://github.com/yayuuu/hyprland-scroll-overview
# Upstream's commit_pins point at upstream commits, so they're not carried
# over; this fork tracks current Hyprland releases from main.
[repository]
name = "hlsovpp"
authors = ["jgarza", "yayuuu"]

[scrolloverview]
description = "ScrollOverview (fork) with per-window motion: windows ripple, converge or sweep into the overview."
authors = ["yayuuu", "jgarza"]
output = "scrolloverview.so"
build = [
    "make all",
]
